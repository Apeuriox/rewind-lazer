name: Build

on:
  push:
    branches:
      - dev
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CI: true
  HUSKY: "0"
  NX_DAEMON: "false"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      ELECTRON_CACHE: ${{ runner.temp }}/electron-cache
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04

    steps:
      - name: Enable Git long paths
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Cache electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-v2-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            electron-v2-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Build and package
        run: yarn desktop:build:prod -- --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rewind-lazer-${{ matrix.name }}
          path: |
            dist/electron/*.exe
            dist/electron/*.exe.blockmap
            dist/electron/*.AppImage
            dist/electron/*.deb
            dist/electron/*.rpm
            dist/electron/*.snap
            dist/electron/*.tar.gz
            dist/electron/*.zip
            dist/electron/*.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
